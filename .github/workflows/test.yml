name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One red job should not cancel the rest: on a matrix this small the
      # full picture (which OS, which Python) is worth the extra minutes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with the lab extra
        # The test suite imports the full runnable agent (fastmcp, netmiko,
        # yaml, httpx), so the base install is not enough here.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lab]" pytest
      - name: Run the test suite
        run: pytest -q

  packaging:
    name: build + metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate metadata
        # Lesson from launch day (2026-07-11): valid TOML can still be invalid
        # packaging metadata, and only the packaging toolchain proves it.
        run: twine check --strict dist/*
      - name: Cold-install the wheel and import
        run: |
          pip install dist/*.whl
          python -c "import netagent; print('netagent', netagent.__version__)"
